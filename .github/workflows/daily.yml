name: daily job digest

on:
  schedule:
    # 06:00 IST, weekdays. IST is UTC+5:30, so 06:00 IST == 00:30 UTC.
    - cron: "30 0 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip Telegram, just build the digest artifact"
        type: boolean
        default: false

concurrency:
  group: jobhunt-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Restore the dedupe store
        uses: actions/cache@v4
        with:
          path: seen.json
          key: jobhunt-seen-${{ github.run_id }}
          restore-keys: |
            jobhunt-seen-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write profile.json
        # PROFILE_JSON is preferred. When absent, use the GitHub-derived seed
        # profile shipped in the repo. Replace it with a resume-derived secret
        # once exact years/education/seniority should influence scoring.
        env:
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
        run: |
          if [ -n "$PROFILE_JSON" ]; then
            printf '%s' "$PROFILE_JSON" > profile.json
            echo "Using PROFILE_JSON secret"
          else
            cp profile.github_seed.json profile.json
            echo "Using profile.github_seed.json"
          fi
          python -c "import json;json.load(open('profile.json'));print('profile.json parsed OK')"

      - name: Run the pipeline
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          SCREEN_PROVIDER: ${{ vars.SCREEN_PROVIDER }}
          DRAFT_PROVIDER: ${{ vars.DRAFT_PROVIDER }}
          SCREEN_MODEL: ${{ vars.SCREEN_MODEL || 'gemini-3.5-flash-lite' }}
          DRAFT_MODEL: ${{ vars.DRAFT_MODEL || 'gemini-2.5-flash' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m jobhunt run

      - name: Notify Telegram
        if: ${{ inputs.dry_run != true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python .github/scripts/notify_telegram.py --top 7 --threshold 7.5

      - name: Upload digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_number }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore

      - name: Report the dedupe store
        if: always()
        run: |
          if [ -f seen.json ]; then
            python -c "import json;print(f'tracking {len(json.load(open(\"seen.json\")))} postings')"
          else
            echo "no seen.json — first run, or the cache expired"
          fi
