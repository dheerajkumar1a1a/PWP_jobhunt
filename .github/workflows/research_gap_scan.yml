name: Research Gap Scan

on:
  workflow_dispatch:
  schedule:
    # 11:30 AM India Standard Time (Asia/Kolkata) every day.
    - cron: "30 11 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_ENABLED: "true"
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GMAIL_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest research_gap_agent/tests -q
      - name: Run discovery scan
        run: python -m research_gap_agent.cli scan --config research_gap_agent/config/technology_spec.yaml --db data/research_gap.db --report out/research_gap_report.md
      - name: Notify Telegram
        if: always()
        run: |
          python - <<'PY'
          import os, sqlite3, json
          from research_gap_agent.telegram import send_message, format_run_summary, format_candidate, format_email_draft, format_gmail_draft
          token = os.getenv('TELEGRAM_BOT_TOKEN','').strip()
          chat_id = os.getenv('TELEGRAM_CHAT_ID','').strip()
          if not token or not chat_id:
              print('Telegram secrets missing; skipping notification.')
              raise SystemExit(0)

          send_message(format_run_summary(
              int(os.getenv('RG_SCANNED','0')),
              int(os.getenv('RG_CANDIDATES','0')),
              int(os.getenv('RG_PRIORITY','0')),
              int(os.getenv('RG_ERRORS','0')),
              int(os.getenv('RG_DEEP_FULLTEXT','0')),
              int(os.getenv('RG_VERIFIED_CONTACTS','0')),
              int(os.getenv('RG_GMAIL_DRAFTS','0')),
              int(os.getenv('RG_GMAIL_ERRORS','0')),
          ))

          db = 'data/research_gap.db'
          if not os.path.exists(db):
              raise SystemExit(0)
          conn = sqlite3.connect(db)
          targets = conn.execute('SELECT author_name, affiliations_json, researcher_score, papers_json FROM researcher_targets ORDER BY researcher_score DESC LIMIT 3').fetchall()
          drafts = conn.execute('SELECT author_name, pitch, email, gmail_draft_id, gmail_thread_id, gmail_status, gmail_subject FROM drafts ORDER BY rowid DESC').fetchall()
          conn.close()

          draft_by_author = {}
          for row in drafts:
              author, pitch, email, draft_id, thread_id, status, subject = row
              if author not in draft_by_author:
                  draft_by_author[author] = (pitch, email, draft_id, thread_id, status or '', subject or '')

          for name, affiliations, score, papers_json in targets:
              affs = json.loads(affiliations or '[]')
              papers = json.loads(papers_json or '[]')
              aff = ', '.join(affs[:2]) if affs else 'Affiliation not resolved'
              paper = papers[0].get('title','') if papers else 'Paper not available'
              gaps = papers[0].get('gaps') or [] if papers else []
              gap = gaps[0].get('evidence','Gap evidence pending') if gaps else 'Gap evidence pending'
              send_message(format_candidate(name, aff, paper, float(score), gap))
              pitch, email, draft_id, thread_id, status, subject = draft_by_author.get(name, ('', '', None, None, 'skipped_unverified', ''))
              if email:
                  subj = subject or f"Research internship proposal inspired by {paper}"[:240]
                  draft_text, markup = format_email_draft(name, subj, email)
                  send_message(draft_text, reply_markup=markup)
              # Gmail draft tracking alert (verified contacts only get real drafts).
              conn2 = sqlite3.connect(db)
              try:
                  contact = conn2.execute('SELECT public_email FROM contacts WHERE author_name=? AND public_email IS NOT NULL ORDER BY rowid DESC LIMIT 1', (name,)).fetchone()
              finally:
                  conn2.close()
              to_email = (contact[0] if contact else '')
              gmail_text, gmail_markup = format_gmail_draft(name, to_email, subj if email else (subject or paper), draft_id, thread_id, status or 'skipped_unverified')
              send_message(gmail_text, reply_markup=gmail_markup)
          PY
      - name: Upload review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-gap-review
          path: |
            data/research_gap.db
            out/research_gap_report.md
