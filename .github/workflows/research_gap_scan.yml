name: Research Gap Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      TELEGRAM_ENABLED: ${{ vars.TELEGRAM_ENABLED || 'false' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest research_gap_agent/tests -q
      - name: Run discovery scan
        run: python -m research_gap_agent.cli scan --config research_gap_agent/config/technology_spec.yaml --db data/research_gap.db --report out/research_gap_report.md
      - name: Notify Telegram
        if: always()
        run: |
          python - <<'PY'
          import os
          import sqlite3
          import json
          from research_gap_agent.telegram import send_message, format_run_summary, format_candidate

          enabled = os.getenv('TELEGRAM_ENABLED','false').lower() == 'true'
          if not enabled:
              raise SystemExit(0)
          scanned = os.getenv('RG_SCANNED','0')
          candidates = os.getenv('RG_CANDIDATES','0')
          priority = os.getenv('RG_PRIORITY','0')
          send_message(format_run_summary(scanned, candidates, priority))
          db = 'data/research_gap.db'
          if os.path.exists(db):
              conn = sqlite3.connect(db)
              rows = conn.execute('SELECT author_name, affiliations_json, researcher_score, papers_json FROM researcher_targets ORDER BY researcher_score DESC LIMIT 3').fetchall()
              conn.close()
              for name, affiliations, score, papers_json in rows:
                  affs = json.loads(affiliations or '[]')
                  papers = json.loads(papers_json or '[]')
                  aff = ', '.join(affs[:2]) if affs else 'Affiliation not resolved'
                  paper = papers[0].get('title','') if papers else 'Paper not available'
                  gap = (papers[0].get('gaps') or [{}])[0].get('evidence','') if papers else 'Gap evidence pending'
                  send_message(format_candidate(name, aff, paper, float(score), gap))
          PY
      - name: Upload review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-gap-review
          path: |
            data/research_gap.db
            out/research_gap_report.md
