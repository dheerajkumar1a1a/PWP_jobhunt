# Personalized jobhunt configuration for Dheeraj Kumar.
# Discovery uses public ATS adapters plus JobSpy. LLM screening remains the
# relevance gate; the agent never submits applications.

filters:
  include_titles:
    - '\b(data\s+analyst|data\s+science\s+analyst|business\s+data\s+analyst|analytics\s+analyst)\b'
    - '\b(data\s+scientist|data\s+science)\b'
    - '\b(machine\s+learning|ml)\b.*\b(engineer|developer|specialist|analyst)\b'
    - '\b(computer\s+vision|cv)\b.*\b(engineer|developer|scientist|specialist)\b'
    - '\b(ai|artificial\s+intelligence)\b.*\b(engineer|developer|specialist|analyst)\b'
    - '\b(ai|automation|rpa)\b.*\b(engineer|developer|specialist)\b'
    - '\bpython\b.*\b(developer|engineer)\b'
    - '\b(research|applied\s+research)\b.*\b(analyst|engineer|associate|assistant|specialist)\b'

  exclude_titles:
    - '\b(staff|principal|distinguished|fellow|architect)\b'
    - '\b(senior|sr\.?|lead)\b'
    - '\b(director|vp|vice\s+president|head\s+of|chief|cto|manager|management)\b'
    - '\b(intern|internship|apprentice|trainee)\b'
    - '\b(sales|account\s+executive|marketing|recruit|recruiter|support|customer\s+success)\b'
    - '\b(frontend|front-end|ios|android|mobile|game|ui/?ux|designer|devops|sre|platform\s+engineer)\b'

  locations:
    - bengaluru
    - bangalore
    - hyderabad
    - pune
    - delhi
    - new delhi
    - noida
    - gurgaon
    - gurugram
    - mumbai
    - chennai
    - kolkata
    - ahmedabad
    - kanpur
    - india

  allow_remote: true
  max_age_days: 14

# --- JobSpy multi-board discovery ------------------------------------------
# Current Python JobSpy sites are used here. Naukri is deliberately not listed
# because the current upstream Python package does not expose it as a native
# scraper; the Naukri fallback is documented in the setup notes.
jobspy:
  enabled: true
  sites:
    - linkedin
    - indeed
    - glassdoor
    - google
    - zip_recruiter
    - bayt
    - bdjobs
  search_terms:
    - data analyst
    - data scientist
    - machine learning engineer
    - computer vision engineer
    - AI automation engineer
    - Python developer
    - research analyst
  locations:
    - Bengaluru, India
    - Hyderabad, India
    - Pune, India
    - Delhi NCR, India
    - Mumbai, India
    - Remote, India
  results_wanted: 10
  hours_old: 168
  country_indeed: India
  distance: 50
  is_remote: true
  job_type: fulltime
  linkedin_fetch_description: true
  sleep_seconds: 0.5

# --- LLM stages -------------------------------------------------------------
screen_batch_size: 8
screen_jd_chars: 1800
draft_jd_chars: 6000
score_threshold: 7.5
max_per_digest: 7

# --- paths ------------------------------------------------------------------
companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv
